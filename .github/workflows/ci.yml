name: Midnight Dark Pool DEX CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-frontend:
    name: Frontend Quality & Typecheck
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install --legacy-peer-deps

    - name: Run TypeScript Typecheck
      working-directory: ./frontend
      run: npx tsc --noEmit

    - name: Run Unit Tests
      working-directory: ./frontend
      run: npm test

  test-contracts:
    name: Smart Contracts & ZK Circuits
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: contracts/package.json

    - name: Install Contracts Dependencies
      working-directory: ./contracts
      run: npm install --legacy-peer-deps

    - name: Install Midnight Compact Compiler
      run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh

    - name: Compile Compact Contract
      working-directory: ./contracts
      run: |
        export PATH="$HOME/.compact/bin:$PATH"
        compact update
        compact compile --skip-zk src/darkpool.compact src/managed/darkpool

    - name: Upload Compiled Contract Bindings
      uses: actions/upload-artifact@v4
      with:
        name: midnight-compact-bindings
        path: contracts/src/managed/darkpool/

    - name: Run Contract Compact Runtime & Preprod E2E Tests
      working-directory: ./contracts
      run: npm test
