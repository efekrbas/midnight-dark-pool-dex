name: Midnight Dark Pool DEX CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-frontend:
    name: Frontend Quality & Typecheck
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install --legacy-peer-deps

    - name: Run TypeScript Typecheck
      working-directory: ./frontend
      run: npx tsc --noEmit

    - name: Run Unit Tests
      working-directory: ./frontend
      run: npm test

  test-contracts:
    name: Smart Contracts & ZK Circuits
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: contracts/package.json

    - name: Install Contracts Dependencies
      working-directory: ./contracts
      run: npm install --legacy-peer-deps

    - name: Install Midnight Compact Compiler
      env:
        COMPACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        echo "$HOME/.compact/bin" >> $GITHUB_PATH
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Compile Compact Contract
      working-directory: ./contracts
      env:
        COMPACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        export PATH="$HOME/.local/bin:$HOME/.compact/bin:$HOME/.cargo/bin:$PATH"
        if command -v compact &> /dev/null; then
          echo "Compact CLI found at: $(which compact)"
          compact --version || true
          compact update || true
          mkdir -p src/managed/darkpool
          compact compile --skip-zk src/darkpool.compact src/managed/darkpool
        else
          echo "Error: compact CLI not found in PATH"
          find $HOME -name "compact" -type f 2>/dev/null || true
          exit 1
        fi

    - name: Upload Compiled Contract Bindings
      uses: actions/upload-artifact@v4
      with:
        name: midnight-compact-bindings
        path: contracts/src/managed/darkpool/
        if-no-files-found: ignore

    - name: Run Contract Compact Runtime & Preprod E2E Tests
      working-directory: ./contracts
      run: npm test
