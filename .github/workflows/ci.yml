name: Midnight Dark Pool DEX CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-frontend:
    name: Frontend Quality & Typecheck
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install --legacy-peer-deps

    - name: Run TypeScript Typecheck
      working-directory: ./frontend
      run: npx tsc --noEmit

    - name: Run Unit Tests
      working-directory: ./frontend
      run: npm test

  test-contracts:
    name: Smart Contracts & ZK Circuits
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: contracts/package.json

    - name: Install Contracts Dependencies
      working-directory: ./contracts
      run: npm install --legacy-peer-deps

    - name: Verify Compact Circuit Definitions
      working-directory: ./contracts
      run: npm run build

    - name: Run Contract Integration Tests
      working-directory: ./contracts
      run: npm test
