name: Midnight Dark Pool DEX CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-frontend:
    name: Frontend Quality & Typecheck
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install --legacy-peer-deps

    - name: Run TypeScript Typecheck
      working-directory: ./frontend
      run: npx tsc --noEmit

    - name: Run Unit Tests
      working-directory: ./frontend
      run: npm test

  test-contracts:
    name: Smart Contracts & ZK Circuits
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: contracts/package.json

    - name: Install Contracts Dependencies
      working-directory: ./contracts
      run: npm install --legacy-peer-deps

    - name: Compile Compact Contract (optional — requires Midnight Compact CLI)
      working-directory: ./contracts
      continue-on-error: true
      run: |
        if command -v compact &> /dev/null; then
          compact compile --skip-zk src/darkpool.compact src/managed/darkpool
          echo "✅ Compact compilation succeeded"
        else
          echo "⚠️ Midnight Compact compiler not available in CI — skipping compilation step."
          echo "   Install locally with: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh"
          echo "   Pre-compiled bindings are checked in under contracts/src/managed/"
        fi

    - name: Run Contract Compact Runtime & Preprod E2E Tests
      working-directory: ./contracts
      run: npm test
